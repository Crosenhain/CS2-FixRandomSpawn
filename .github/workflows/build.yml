name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build -c Release -p:ContinuousIntegrationBuild=true

      # Flat layout: extract into addons/counterstrikesharp/plugins/FixRandomSpawn/
      - name: Package
        run: |
          mkdir -p dist
          cd bin/Release/net8.0
          zip -r ../../../dist/FixRandomSpawn.zip FixRandomSpawn.dll FixRandomSpawn.deps.json FixRandomSpawn.pdb gamedata lang
          cd ../../../dist
          unzip -l FixRandomSpawn.zip
          sha256sum FixRandomSpawn.zip | tee FixRandomSpawn.zip.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: FixRandomSpawn
          path: dist/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/FixRandomSpawn.zip dist/FixRandomSpawn.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
